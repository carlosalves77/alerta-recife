services:
  postgres_alerta_recife:
    image: postgis/postgis:16-3.4
    container_name: alerta_recife_database
    environment:
      - POSTGRES_USER=${postgres_user}
      - POSTGRES_PASSWORD=${postgres_password}
      - POSTGRES_DB=${postgres_database}
    ports:
      - "5005:5432"
    networks:
      - internal
    volumes:
      - alerta_recife:/var/lib/postgresql/data

  alerta_recife_project:
    build:
      context: .
      target: runner
    image: alerta_recife:latest
    container_name: alerta_recife_project
    depends_on:
      - postgres_alerta_recife
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_alerta_recife:5432/${postgres_database}
      - SPRING_DATASOURCE_USERNAME=${spring_user}
      - SPRING_DATASOURCE_PASSWORD=${spring_password}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_FLYWAY_ENABLE=true
      - SPRING_FLYWAY_CLEAN_DISABLED=false
      - SERVER_PORT=4010
      - SPRING_JPA_OPEN_IN_VIEW=false
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - CLOUDFLARE_R2_ENDPOINT=${R2_ENDPOINT}
      - CLOUDFLARE_R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - CLOUDFLARE_R2_SECRET_KEY=${R2_SECRET_KEY}
      - CLOUDFLARE_R2_BUCKET_NAME=alerta-recife
      - CLOUDFLARE_R2_PUBLIC_URL=https://cdn.carldev.online
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=10MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=10MB
      - SPRING_MVC_THROW_EXCEPTION_IF_NO_HANDLER_FOUND=true
      - SPRING_WEB_RESOURCES_ADD_MAPPINGS=false
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE=email, profile
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI=http://localhost:4010/login/oauth2/code/google
      - SPRING_MVC_CORS_ALLOWED_ORIGINS=http://localhost:5173

    ports:
      - "4010:4010"
    networks:
      - internal

volumes:
  alerta_recife:

networks:
  internal:
    external: true